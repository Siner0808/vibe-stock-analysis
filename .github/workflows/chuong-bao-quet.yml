# Chuông báo: ngày làm việc mà không có lượt quét sổ lệnh nào thành công.
#
# VÌ SAO CẦN. Từ 20/08/2026 Task Scheduler đã tắt, chỉ còn Actions quét.
# Trước đó máy cục bộ vô tình làm lưới dự phòng. Giờ một ngày mà mọi lượt
# quét đều hỏng thì sổ lệnh không cập nhật và KHÔNG AI BIẾT.
#
# GIỚI HẠN PHẢI BIẾT. Chuông này chạy bằng chính cron GitHub, và chuông
# không kêu thì im lặng — nên phải biết nó rơi nhịp bao nhiêu.
#
# ĐO LẠI 05/09/2026 — CON SỐ CŨ Ở ĐÂY SAI, VÀ SAI VÌ MƯỢN.
# Bản trước viết "rơi mất khoảng một nửa số nhịp". 50% là tỷ lệ của
# `quet-so-lenh`, workflow có 12 nhịp/ngày. Chuông có ĐÚNG MỘT nhịp một
# ngày, và trên 14 ngày-chuông (ba chuông cộng lại) nó rơi 0 lần. Lần
# rơi duy nhất là 03/09 — đúng ngày file workflow này bị sửa, và cả ba
# chuông cùng rơi đúng ngày đó. Cận trên 95% theo quy tắc ba: ~21%,
# không phải 0 mà cũng không phải 50%.
#
# Cửa sổ BA ngày bên dưới VẪN ĐÚNG; chỉ lý do là khác, và biên an toàn
# rộng hơn chỗ từng nghĩ. Chi tiết: docs/STATE.md BƯỚC 28.
# Vì thế nó soát BA ngày làm việc gần nhất chứ không chỉ hôm nay: một
# nhịp chuông rơi thì nhịp hôm sau vẫn bắt được ngày đó. Cửa sổ im lặng
# thu từ "một nhịp" xuống "ba nhịp liên tiếp", không xuống 0.
#
# Chuông kêu bằng cách để lượt chạy này ĐỎ. GitHub gửi email cho người
# sửa cron gần nhất khi một workflow theo lịch thất bại — đó là đường
# thông báo, không cần dựng thêm gì.

name: Chuông báo quét

on:
  schedule:
    # 09:23 UTC = 16:23 ICT, sau giờ đóng cửa (15:00) và sau lượt quét
    # cuối cùng trong ngày (đo được: 15:29–15:33 ICT).
    # LỆCH KHỎI MỐC :00 VÀ :30 CÓ CHỦ ĐÍCH (03/09/2026)
    # Đo được: nhịp ở 09:00 và 09:30 UTC trễ trung vị 4–4,7 GIỜ, trong khi
    # tài liệu dự án ghi "5 → 90 phút". Tài liệu GitHub khuyên tránh đầu
    # giờ vì đó là lúc nhiều workflow cùng xin chạy nhất.
    # Đây là GIẢ THUYẾT, chưa phải phép sửa đã chứng minh — tiêu chí phán
    # xử khai trước ở docs/STATE.md, BƯỚC 20. KHÔNG dời sớm hơn:
    # `chuong_bao_quet.kiem_tra()` soát cả ngày hôm nay và báo đỏ khi ngày
    # đó chưa có lượt quét nào.
    - cron: '23 9 * * 1-5'
  workflow_dispatch:

# Chỉ cần đọc danh sách lượt chạy. Không ghi gì.
permissions:
  actions: read
  contents: read

jobs:
  chuong:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Không cài thư viện: công cụ chỉ dùng urllib trong thư viện chuẩn.
      # Ít bộ phận hơn thì ít chỗ hỏng hơn — chuông mà hỏng thì vô dụng.
      - name: Soát ba ngày làm việc gần nhất
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/chuong_bao_quet.py
