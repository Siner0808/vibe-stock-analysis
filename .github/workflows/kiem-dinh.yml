# Hàng rào tự động — Phase 4 của kế hoạch sửa chữa.
#
# Vì sao cần: 204 test tồn tại mà không cái nào chặn được commit hay deploy.
# Streamlit Cloud deploy theo push, push không đi qua test — đúng đường mà
# +636,11% đã lên production và nằm đó nhiều ngày.
#
# GIỚI HẠN PHẢI BIẾT: Streamlit Cloud KHÔNG nghe lệnh GitHub Actions.
# Workflow này chỉ báo đỏ, nó không chặn được deploy. Muốn nó thành cửa
# thật thì phải bật Settings -> Branches -> Require status checks -> chọn
# `kiem-dinh`, rồi làm việc trên nhánh và chỉ merge vào main khi xanh.
# Đó là thay đổi THÓI QUEN, không phải thay đổi mã nguồn.

name: kiem-dinh

on:
  push:
  pull_request:

jobs:
  kiem-dinh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Cài thư viện
        # pytest KHÔNG nằm trong requirements.txt vì nó là thư viện phát
        # triển, còn requirements.txt là thứ Streamlit Cloud cài để chạy app.
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Bộ test
        # Runner sạch: không secrets.toml, không paper_trades.db, không
        # sl_pattern_memory.json, không backtest/cache/ — tất cả đều
        # gitignore. Bộ test được viết để chạy trong đúng điều kiện đó.
        #
        # In tên test đỏ ra dưới dạng `::error::` để chúng thành ANNOTATION.
        # Log của Actions cần đăng nhập mới đọc được, còn annotation thì
        # công khai qua API. Không có nó thì một lượt CI đỏ chỉ để lại đúng
        # dòng "Process completed with exit code 1" — không đủ để sửa.
        run: |
          set +e
          python -m pytest tests/ -q --tb=short > kq.txt 2>&1
          ma=$?
          cat kq.txt
          grep '^FAILED' kq.txt | while read -r d; do echo "::error::$d"; done
          if [ "$ma" -ne 0 ] && ! grep -q '^FAILED' kq.txt; then
            echo "::error::pytest thoát $ma nhưng không có dòng FAILED nào — xem log đầy đủ"
            tail -30 kq.txt | while read -r d; do echo "::error::$d"; done
          fi
          exit $ma

      - name: Cú pháp Python 3.11 — gồm cả python nhúng trong workflow YAML
        # Chỗ mù mà KHÔNG bước nào khác canh: `quet-so-lenh.yml` có hơn 70
        # dòng python nằm trong heredoc. Chúng chạy trên runner y hệt một
        # file `.py`, nhưng `rglob("*.py")` không thấy và không test nào
        # import. Hỏng thì chỉ lộ ra khi cron nổ giữa phiên giao dịch.
        #
        # Trước 31/08/2026 công cụ này chỉ chạy bằng tay ("CHẠY TRƯỚC KHI
        # PUSH" trong CLAUDE.md) — tức là một hàng rào dựa vào trí nhớ.
        #
        # Mã thoát 2 nghĩa là "CHƯA KIỂM ĐƯỢC", và trên runner này đó là
        # LỖI chứ không phải bỏ qua: runner CHÍNH LÀ 3.11. Coi 2 là xanh
        # thì đây thành đúng thứ cổng xanh giả mà nó sinh ra để chặn.
        run: |
          set +e
          python tools/kiem_cu_phap_311.py
          ma=$?
          if [ "$ma" -eq 2 ]; then
            echo "::error::kiem_cu_phap_311 trả 2 (chưa kiểm được) — trên CI đó là lỗi, runner này là 3.11"
            exit 1
          fi
          exit $ma

      - name: Quét mẫu bịa số liệu toàn repo
        # Hook .claude/settings.json là PostToolUse và chỉ bắt Write/Edit
        # của Claude Code — sửa từ IDE, Antigravity, tay người, git merge
        # đều không kích hoạt. Bước này quét TOÀN BỘ repo, không phụ thuộc
        # ai đã sửa file bằng công cụ gì.
        # Thoát 1 khi có mẫu mức CHẶN; cảnh báo không làm đỏ.
        run: python tools/chan_bia_so_lieu.py --quet-repo
